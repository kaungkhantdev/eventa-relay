name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # eslint directly, NOT `pnpm lint`: that script carries `--fix`, which in
      # CI rewrites the checkout and exits 0, so every fixable problem would
      # pass silently.
      - name: Lint
        run: npx eslint "src/**/*.ts"

      # No `typecheck` script in this repo; `nest build` type-checks on the way
      # through, and it is the next step.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
